[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcycle"
version = "0.2.0"
license = { text = "MIT" }
authors = [{ name = "Paul Emptoz" }, { name = "Gonzalo Adarraga" }]
description = "Smart Cycle MVP: road-quality classification on cycleways from smartphone accelerometer + GPS"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
qr = ["segno"]  # scripts/make_qr.py (offline QR code of the demo URL)

[project.scripts]
smartcycle = "smartcycle.cli:main"

[tool.setuptools.packages.find]
include = ["smartcycle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
